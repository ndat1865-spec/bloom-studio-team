spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URI:http://localhost:18081}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: products
              uri: ${PRODUCT_SERVICE_URI:http://localhost:18082}
              predicates:
                - Path=/api/products,/api/products/**,/api/categories
              filters:
                - StripPrefix=1
            - id: orders
              uri: ${ORDER_SERVICE_URI:http://localhost:18083}
              predicates:
                - Path=/api/orders/demo,/api/orders/preview
              filters:
                - StripPrefix=1
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:15173
                  - http://127.0.0.1:15173
                  - http://localhost:15174
                  - http://127.0.0.1:15174
                allowedMethods: [GET, POST, OPTIONS]
                allowedHeaders: [Content-Type, Authorization]
                maxAge: 3600
